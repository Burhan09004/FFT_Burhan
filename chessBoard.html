<html>
  <head>
    <title>Chess game</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        text-align: center;
      }

      .parent {
        width: 820px;
        height: 820px;
        margin: auto;
        display: grid;
        grid-template-columns: auto auto auto auto auto auto auto auto;
        border: 10px solid black;
      }

      div {
        width: 100px;
        height: 100px;

        border: 1px solid black;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 65px;
      }

      h1 {
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <h1>Chess Board Game</h1>

    <div class="parent">
      <!-- Row 1 -->
      <div style="background: black">♜</div>
      <div>♞</div>
      <div style="background: black">♝</div>
      <div>♛</div>
      <div style="background: black">♚</div>
      <div>♝</div>
      <div style="background: black">♞</div>
      <div>♜</div>

      <!-- Row 2 -->
      <div>♟</div>
      <div style="background: black">♟</div>
      <div>♟</div>
      <div style="background: black">♟</div>
      <div>♟</div>
      <div style="background: black">♟</div>
      <div>♟</div>
      <div style="background: black">♟</div>

      <!-- Row 3 -->
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>

      <!-- Row 4 -->
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>

      <!-- Row 5 -->
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>

      <!-- Row 6 -->
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>
      <div></div>
      <div style="background: black"></div>

      <!-- Row 7 -->
      <div style="background: black">♙</div>
      <div>♙</div>
      <div style="background: black">♙</div>
      <div>♙</div>
      <div style="background: black">♙</div>
      <div>♙</div>
      <div style="background: black">♙</div>
      <div>♙</div>

      <!-- Row 8 -->
      <div>♖</div>
      <div style="background: black">♘</div>
      <div>♗</div>
      <div style="background: black">♕</div>
      <div>♔</div>
      <div style="background: black">♗</div>
      <div>♘</div>
      <div style="background: black">♖</div>
    </div>
  </body>
</html>
